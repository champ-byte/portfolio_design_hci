<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kavya Zala — AI Engineer & Researcher</title>
    <meta name="description" content="Kavya Zala is a Computer Science undergrad at VJTI Mumbai building AI agents, knowledge-graph retrieval systems and thoughtful interfaces." />
    <meta name="theme-color" content="#F3F1E8" />
    <meta property="og:title" content="Kavya Zala — AI Engineer & Researcher" />
    <meta property="og:description" content="Building intelligent agents that reason, remember, and respond." />
    <meta property="og:image" content="/images/og.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/images/avatar.webp" fetchpriority="high" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
        var m = null
        try { m = localStorage.getItem('motion') } catch (e) {}
        document.documentElement.dataset.motion = m === 'paused' ? 'paused' : 'on'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#0F1712' : '#F3F1E8')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
